[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "route-opti"
version = "0.1.0"
description = "Playground for route optimization experiments"
readme = "README.md"
authors = [{ name = "Your Name" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
route-opti-demo = "route_opti.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
